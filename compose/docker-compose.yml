# 웹 서버(커스텀 nginx) + 보조 서비스(헬스 체커) 멀티 컨테이너 구성
services:
  web:
    build: ../app              # app/Dockerfile 로 이미지 빌드
    image: my-web:compose
    environment:
      APP_ENV: ${APP_ENV:-dev}   # .env / 셸 환경변수로 실행 모드 주입
    ports:
      - "${WEB_PORT:-8090}:80"   # .env / 셸 환경변수로 호스트 포트 주입
    volumes:
      - webdata:/data

  checker:
    image: busybox:1.37
    depends_on:
      - web
    # 같은 Compose 네트워크 안에서는 서비스 이름(web)으로 접근 가능 (서비스 디스커버리)
    command: ["sh", "-c", "while true; do echo \"[checker] web/health -> $$(wget -qO- http://web/health)\"; sleep 5; done"]

volumes:
  webdata:
