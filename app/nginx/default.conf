server {
    listen       80;
    server_name  localhost;

    # 커스텀 응답 헤더: 이 이미지에서 서빙되었음을 확인
    add_header X-Served-By "codyssey-custom-nginx" always;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
    }

    # 헬스체크용 엔드포인트
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
